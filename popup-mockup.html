<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tab-volume | 保存設定の画面イメージ</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 32px 14px; background: #eef2f8; color: #18233b; font: 14px/1.6 system-ui, sans-serif; }
main { max-width: 460px; margin: auto; }
.caption { margin: 0 0 8px; color: #465570; font-size: 12px; }
.panel { background: white; border: 1px solid #d7dfec; border-radius: 18px; box-shadow: 0 12px 36px #223a641c; overflow: hidden; }
header, section { padding: 18px 20px; }
header { position: relative; background: #152643; color: white; }
h1, h2, p { margin: 0; }
h1 { font-size: 20px; }
h2 { font-size: 16px; }
section + section { border-top: 1px solid #e2e8f2; }
.tab { color: #c8d7ed; font-size: 12px; overflow-wrap: anywhere; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
input[type=range] { display: block; width: 100%; margin: 12px 0 4px; accent-color: #255ac5; }
.volume-scale { position: relative; height: 24px; margin: 0 8px 8px; color: #4f5d75; font-size: 9px; font-variant-numeric: tabular-nums; }
.volume-scale span { position: absolute; left: var(--position); transform: translateX(-50%); text-align: center; }
.volume-scale span::before { content: ""; display: block; width: 1px; height: 8px; margin: 0 auto 2px; background: #8594ae; }
.volume-scale .minor-tick::before { height: 4px; }
input[type=radio], input[type=checkbox] { accent-color: #255ac5; }
output { color: #1948a1; font-weight: 750; font-size: 23px; font-variant-numeric: tabular-nums; }
.muted { color: #4f5d75; font-size: 12px; }
fieldset { margin: 12px 0; padding: 0; border: 0; min-width: 0; }
legend { margin-bottom: 5px; font-weight: 650; }
.choice { display: flex; gap: 9px; padding: 9px 10px; margin-bottom: 6px; border: 1px solid #dce4ef; border-radius: 9px; cursor: pointer; }
.choice:has(input:checked) { background: #eff5ff; border-color: #638adc; }
.choice:has(input:disabled) { color: #52627b; cursor: default; }
.choice input { align-self: start; margin: 5px 0 0; }
.choice small { display: block; overflow-wrap: anywhere; color: #4f5d75; }
.query-item { display: block; overflow-wrap: anywhere; }
.saved { padding: 9px 11px; border-radius: 9px; background: #f2f5fa; overflow-wrap: anywhere; }
.saved-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.saved-copy { min-width: 0; }
.saved-controls { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.saved-controls button { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; }
.saved-controls [data-action="apply"] { width: auto; padding: 0 10px; font-weight: 650; white-space: nowrap; }
.actions { margin: 10px 0 0; }
.saved-conditions { margin-top: 14px; }
.saved-conditions h3 { margin: 0 0 4px; font-size: 14px; }
button, select { font: inherit; }
button { border: 1px solid #bccae0; background: white; color: #203458; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button.primary { background: #255ac5; color: white; border-color: #255ac5; }
button:disabled { opacity: .55; cursor: default; }
select { border: 1px solid #bccae0; border-radius: 7px; padding: 4px; background: white; }
header h1, header .tab { margin-right: 46px; }
.options-toggle { position: absolute; top: 18px; right: 20px; list-style: none; display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid #8093b2; border-radius: 8px; cursor: pointer; }
.options-toggle::-webkit-details-marker { display: none; }
.options-toggle:hover, details[open] .options-toggle { background: #ffffff20; }
.options-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.options-panel { margin-top: 12px; padding: 12px; border: 1px solid #8093b2; border-radius: 9px; }
.options-panel label { display: block; }
.options-panel select { display: block; width: 100%; margin: 4px 0 8px; }
[data-theme="dark"] { color-scheme: dark; }
[data-theme="dark"] body { background: #101827; color: #e5ecf9; }
[data-theme="dark"] .panel { background: #192438; border-color: #445371; }
[data-theme="dark"] header { background: #111c30; }
[data-theme="dark"] section + section, [data-theme="dark"] .choice { border-color: #445371; }
[data-theme="dark"] .muted, [data-theme="dark"] .caption, [data-theme="dark"] .volume-scale,
[data-theme="dark"] .choice small, [data-theme="dark"] .choice:has(input:disabled) { color: #b6c5df; }
[data-theme="dark"] output { color: #a9c6ff; }
[data-theme="dark"] .saved,
[data-theme="dark"] button, [data-theme="dark"] select { background: #24344f; color: #e5ecf9; border-color: #647796; }
[data-theme="dark"] .choice:has(input:checked) { background: #263f65; border-color: #88a9e7; }
[data-theme="dark"] button.primary { background: #a9c6ff; color: #122341; border-color: #a9c6ff; }
.status { min-height: 19px; margin-top: 7px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="row caption">
    <span>拡張ポップアップの画面イメージ</span>
    <label>サンプル <select id="sample"><option value="youtube">YouTube</option><option value="nico">ニコニコ動画</option></select></label>
  </div>
  <article class="panel">
    <header>
      <h1>tab-volume</h1>
      <p class="tab" id="address"></p>
      <details>
        <summary class="options-toggle" aria-label="オプション" title="オプション">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
            <path d="m10 3-.5 2.2-1.6.9-2.2-.7-2 3.5 1.7 1.5v1.8l-1.7 1.5 2 3.5 2.2-.7 1.6.9.5 2.2h4l.5-2.2 1.6-.9 2.2.7 2-3.5-1.7-1.5v-1.8l1.7-1.5-2-3.5-2.2.7-1.6-.9L14 3z"/>
            <circle cx="12" cy="11.3" r="2.6"/>
          </svg>
        </summary>
        <div class="options-panel">
          <label>目盛り <select id="tick-pattern">
            <option value="50">標準（50%間隔）</option>
            <option value="10">細かめ（10%間隔）</option>
          </select></label>
          <label><input type="checkbox" id="dark-mode"> ダークモード</label>
        </div>
      </details>
    </header>
    <section aria-labelledby="volume-title">
      <div class="row"><h2 id="volume-title">このタブの音量</h2><output id="amount" for="volume">70%</output></div>
      <input id="volume" type="range" min="0" max="500" step="10" value="70" aria-labelledby="volume-title">
      <div id="volume-scale" class="volume-scale" aria-hidden="true"></div>
      <button id="reset" type="button">100% に戻す</button>
      <p id="boost-note" class="muted" hidden>100% を超えると、音源によって音が歪むことがあります。</p>
    </section>
    <section aria-labelledby="save-title">
      <h2 id="save-title">音量設定を保存</h2>
      <p class="muted">この音量をどの URL で使うか選びます。</p>
      <fieldset>
        <legend>保存単位</legend>
        <label class="choice"><input type="radio" name="scope" value="host" checked><span>ホスト<small id="host-detail"></small></span></label>
        <label class="choice"><input type="radio" name="scope" value="path"><span>パス<small id="path-detail"></small></span></label>
        <label class="choice"><input type="radio" name="scope" value="query"><span>パス＋選択したクエリパラメータ<small id="query-detail"></small></span></label>
        <p class="muted">複数の保存条件に一致したときは、一覧の下にある保存単位の設定を優先して表示します。</p>
      </fieldset>
      <fieldset id="queries" hidden>
        <legend>照合するクエリパラメータ</legend>
        <p class="muted">1つ以上選んでください。選んだ項目がすべて一致すると適用できます。</p>
        <div id="query-items"></div>
      </fieldset>
      <div class="actions"><button class="primary" id="save" type="button">この条件で保存</button></div>
      <div class="saved-conditions">
        <h3>保存されている条件</h3>
        <p class="muted" id="saved-empty">このページに一致する保存条件はありません。</p>
        <ul class="saved-list" id="saved-list"></ul>
      </div>
      <template id="saved-item">
        <li class="row saved">
          <div class="saved-copy"><strong></strong><p class="muted"></p></div>
          <div class="saved-controls">
            <button type="button" data-action="apply">適用</button>
            <button type="button" data-action="delete" title="削除">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h12M6 4V2h4v2m2 0-1 10H5L4 4m3 3v4m2-4v4"/></svg>
            </button>
          </div>
        </li>
      </template>
      <p class="muted status" id="status" role="status"></p>
    </section>
  </article>
</main>
<script>
const samples = {
  youtube: 'https://www.youtube.com/watch?v=ABC123&t=30',
  nico: 'https://www.nicovideo.jp/watch/sm46647529'
};
const find = id => document.getElementById(id);
const records = new Map();
const names = { host: 'ホスト', path: 'パス', query: 'パス＋選択したクエリパラメータ' };
const volume = find('volume');
const queryItems = find('query-items');
const tickPattern = find('tick-pattern');
const darkMode = find('dark-mode');
let url;

function renderOptions() {
  document.documentElement.dataset.theme = darkMode.checked ? 'dark' : 'light';
  renderScale();
}

function loadOptions() {
  try {
    const options = JSON.parse(localStorage.getItem('tab-volume-mock-options'));
    tickPattern.value = options?.tickPattern === '10' ? '10' : '50';
    darkMode.checked = options?.darkMode === true;
  } catch {
    // The preview also works when browser storage is unavailable.
  }
  renderOptions();
}

function updateOptions() {
  renderOptions();
  try {
    localStorage.setItem('tab-volume-mock-options', JSON.stringify({
      tickPattern: tickPattern.value,
      darkMode: darkMode.checked
    }));
  } catch {
    // Keep the active options for the current preview.
  }
}

function renderScale() {
  const scale = find('volume-scale');
  const minorStep = Number(tickPattern.value);
  const majorStep = minorStep === 10 ? 50 : 100;
  const max = Number(volume.max);
  scale.replaceChildren();
  for (let value = 0; value <= max; value += minorStep) {
    const tick = document.createElement('span');
    tick.style.setProperty('--position', (value / max * 100) + '%');
    tick.classList.toggle('minor-tick', value % majorStep !== 0);
    if (value % 100 === 0) tick.textContent = value + '%';
    scale.append(tick);
  }
}

function ruleLabel(rule) {
  const base = rule.host + rule.path;
  const params = new URLSearchParams(rule.params).toString();
  return params ? base + '?' + params : base;
}

function render() {
  const scope = document.querySelector('input[name="scope"]:checked').value;
  const params = Array.from(queryItems.querySelectorAll('input:checked'), input => [
    input.value, url.searchParams.get(input.value)
  ]).sort(([left], [right]) => left < right ? -1 : left > right ? 1 : 0);
  const rule = { scope, host: url.hostname, path: scope === 'host' ? '' : url.pathname, params: scope === 'query' ? params : [] };
  const valid = scope !== 'query' || params.length > 0;
  find('queries').hidden = scope !== 'query';
  find('save').disabled = !valid;
  find('amount').value = volume.value + '%';
  find('boost-note').hidden = Number(volume.value) <= 100;
  return rule;
}

function renderSaved() {
  const matches = Array.from(records.entries()).filter(([, item]) =>
    item.host === url.hostname && (!item.path || item.path === url.pathname) &&
    item.params.every(([name, value]) => {
      const values = url.searchParams.getAll(name);
      return values.length === 1 && values[0] === value;
    })
  ).sort(([, left], [, right]) =>
    Object.keys(names).indexOf(right.scope) - Object.keys(names).indexOf(left.scope) ||
    right.params.length - left.params.length || right.order - left.order
  );
  const list = find('saved-list');
  list.replaceChildren();
  find('saved-empty').hidden = matches.length > 0;
  for (const [key, item] of matches) {
    const row = find('saved-item').content.firstElementChild.cloneNode(true);
    const label = names[item.scope] + '：' + item.volume + '%';
    const condition = ruleLabel(item);
    row.querySelector('strong').textContent = label;
    row.querySelector('p').textContent = condition;
    const apply = row.querySelector('[data-action="apply"]');
    apply.setAttribute('aria-label', condition + ' の ' + label + ' を適用');
    apply.addEventListener('click', () => {
      volume.value = item.volume;
      updateVolume();
    });
    const remove = row.querySelector('[data-action="delete"]');
    remove.setAttribute('aria-label', condition + ' の保存条件を削除');
    remove.addEventListener('click', () => {
      records.delete(key);
      find('status').textContent = '保存条件を削除しました';
      renderSaved();
    });
    list.append(row);
  }
}

function loadSample() {
  url = new URL(samples[find('sample').value]);
  find('address').textContent = url.href;
  find('host-detail').textContent = url.hostname;
  find('path-detail').textContent = url.hostname + url.pathname;
  document.querySelector('[value="host"]').checked = true;
  queryItems.replaceChildren();
  for (const name of new Set(url.searchParams.keys())) {
    const values = url.searchParams.getAll(name);
    const label = document.createElement('label');
    label.className = 'query-item';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.value = name;
    input.disabled = values.length !== 1;
    label.append(input, values.length === 1 ? name + '=' + values[0] : name + '（同名項目が複数）');
    queryItems.append(label);
  }
  const hasChoices = Boolean(queryItems.querySelector('input:not(:disabled)'));
  document.querySelector('[value="query"]').disabled = !hasChoices;
  find('query-detail').textContent = hasChoices ? '選んだ名前と値がすべて一致する場合に適用可能' : '選べるクエリパラメータがありません';
  find('status').textContent = '';
  render();
  renderSaved();
}

let order = 0;
find('sample').addEventListener('change', loadSample);
tickPattern.addEventListener('change', updateOptions);
darkMode.addEventListener('change', updateOptions);
document.querySelectorAll('input[name="scope"]').forEach(input => input.addEventListener('change', render));
queryItems.addEventListener('change', render);
function updateVolume() {
  find('status').textContent = '';
  render();
}

volume.addEventListener('input', updateVolume);
find('reset').addEventListener('click', () => { volume.value = 100; updateVolume(); });
find('save').addEventListener('click', () => {
  const rule = render();
  if (find('save').disabled) return;
  records.set(JSON.stringify(rule), { ...rule, volume: Number(volume.value), order: ++order });
  find('status').textContent = names[rule.scope] + '単位で保存しました（プレビュー内）';
  renderSaved();
});
loadOptions();
loadSample();
</script>
</body>
</html>
