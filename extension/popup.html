<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tab-volume</title>
  <link rel="stylesheet" href="styles.css">
  <script src="popup.js" type="module"></script>
</head>
<body class="popup-page">
  <article class="panel" id="popup">
    <header>
      <h1>tab-volume</h1>
      <p class="tab" id="address"></p>
      <select id="language" class="language-select" data-i18n-label="language" data-i18n-title="language" disabled>
        <option value="auto" data-i18n="language_auto"></option>
        <option value="ja" lang="ja">日本語</option>
        <option value="en" lang="en">English</option>
        <option value="hi" lang="hi">हिन्दी</option>
        <option value="zh_CN" lang="zh-CN">简体中文</option>
      </select>
      <p class="tab" id="language-status" role="status"></p>
      <details>
        <summary class="options-toggle" data-i18n-label="options" data-i18n-title="options">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
            <path d="m10 3-.5 2.2-1.6.9-2.2-.7-2 3.5 1.7 1.5v1.8l-1.7 1.5 2 3.5 2.2-.7 1.6.9.5 2.2h4l.5-2.2 1.6-.9 2.2.7 2-3.5-1.7-1.5v-1.8l1.7-1.5-2-3.5-2.2.7-1.6-.9L14 3z"/>
            <circle cx="12" cy="11.3" r="2.6"/>
          </svg>
        </summary>
        <div class="options-panel">
          <label><span data-i18n="tick_marks"></span> <select id="tick-pattern">
            <option value="50" data-i18n="tick_standard"></option>
            <option value="10" data-i18n="tick_fine"></option>
          </select></label>
          <label><input type="checkbox" id="dark-mode"> <span data-i18n="dark_mode"></span></label>
          <button class="options-link" id="open-options" type="button"><span data-i18n="all_settings"></span> <span aria-hidden="true">↗</span></button>
          <p class="tab" id="options-status" role="status"></p>
        </div>
      </details>
    </header>
    <section aria-labelledby="volume-title">
      <div class="row"><h2 id="volume-title" data-i18n="tab_volume"></h2><output id="amount" for="volume">—</output></div>
      <fieldset id="volume-slider" class="volume-slider" aria-labelledby="volume-title" disabled>
        <input id="volume" type="range" min="0" max="500" step="10" value="100" aria-labelledby="volume-title">
        <div id="volume-scale" class="volume-scale"></div>
      </fieldset>
      <div class="volume-actions">
        <button id="reset" type="button" data-i18n="reset_volume" disabled></button>
        <button id="mute" class="mute-button" type="button" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9h4l5-4v14l-5-4H3z"/>
            <path class="speaker-on" d="M16 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/>
            <path class="speaker-off" d="m16 9 6 6m0-6-6 6"/>
          </svg>
          <span id="mute-label" data-i18n="mute"></span>
        </button>
      </div>
      <p id="boost-note" class="muted" data-i18n="boost_warning" hidden></p>
      <div class="capture-notice" id="capture-notice">
        <p class="muted" id="capture-message" data-i18n="checking_tab" role="status"></p>
        <button id="retry" type="button" data-i18n="retry" hidden></button>
      </div>
    </section>
    <section id="saved-area" aria-labelledby="saved-title" hidden>
      <h2 id="saved-title" data-i18n="saved_rules"></h2>
      <p class="muted" id="saved-empty" data-i18n="matching_settings_empty"></p>
      <ul class="saved-list" id="saved-list"></ul>
      <p class="muted list-error" id="saved-error" role="status"></p>
      <p class="visually-hidden" id="apply-announcement" role="status"></p>
    </section>
    <details id="save-area" hidden>
      <summary data-i18n="save_volume"></summary>
      <section data-i18n-label="save_rule">
        <p class="muted" data-i18n="choose_scope"></p>
        <fieldset>
          <legend data-i18n="save_scope"></legend>
          <label class="choice"><input type="radio" name="scope" value="host" checked><span><span data-i18n="scope_host"></span><small id="host-detail"></small></span></label>
          <label class="choice"><input type="radio" name="scope" value="path"><span><span data-i18n="scope_path"></span><small id="path-detail"></small></span></label>
          <label class="choice"><input type="radio" name="scope" value="query"><span><span data-i18n="scope_query"></span><small id="query-detail"></small></span></label>
        </fieldset>
        <fieldset id="queries" hidden>
          <legend data-i18n="query_fields"></legend>
          <p class="muted" data-i18n="choose_query_fields"></p>
          <div id="query-items"></div>
        </fieldset>
        <div class="actions">
          <button class="primary" id="save" type="button" data-i18n="save"></button>
          <span class="save-status" id="save-status" role="status"></span>
        </div>
      </section>
    </details>
  </article>
</body>
</html>
